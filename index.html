<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="0.5; url=/Praktikum-Gasal-2026/">

    <title>Praktikum PBO Gasal 2026</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222222;
        }

        .container {
            width: min(90%, 500px);
            text-align: center;
            padding: 32px;
        }

        .icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #222222;
            color: #ffffff;

            font-size: 20px;
            font-weight: 700;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .description {
            color: #666666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .status {
            font-size: 13px;
            color: #999999;
            margin-bottom: 20px;
        }

        .fallback {
            font-size: 13px;
            color: #888888;
        }

        .fallback a {
            color: #222222;
            font-weight: 600;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #111111;
                color: #eeeeee;
            }

            .icon {
                background: #eeeeee;
                color: #111111;
            }

            .description {
                color: #aaaaaa;
            }

            .status,
            .fallback {
                color: #777777;
            }

            .fallback a {
                color: #eeeeee;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="icon">P</div>

        <h1>Praktikum PBO Gasal 2026</h1>

        <p class="description">
            Redirecting you to the practical course page.
        </p>

        <p class="status">
            Please wait...
        </p>

        <p class="fallback">
            If you are not redirected,
            <a href="/Praktikum-Gasal-2026/">open the page manually</a>.
        </p>
    </main>

    <script>
        setTimeout(() => {
            window.location.replace("/Praktikum-Gasal-2026/");
        }, 500);
    </script>

</body>
</html>
